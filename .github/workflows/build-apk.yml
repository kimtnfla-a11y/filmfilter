name: FilmFilter v5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract FilmFilter v5
        shell: bash
        run: |
          set -e

          rm -rf /tmp/filmfilter-v5
          mkdir -p /tmp/filmfilter-v5

          unzip -q FilmFilter_Pro_v5.zip -d /tmp/filmfilter-v5

          ROOT=$(find /tmp/filmfilter-v5 \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project not found"
            find /tmp/filmfilter-v5 -maxdepth 3 -type f | sort
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "Using project:"
          echo "$ROOT"

          cp -a "$ROOT"/. .

          echo "Project files:"
          ls -la

          echo "App files:"
          find app -maxdepth 5 -type f | sort

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmFilter-v5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
