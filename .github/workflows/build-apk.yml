name: FilmFilter v7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FilmFilter v7
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Gradle 8.11.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 5. Verify build environment
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "JAVA"
          echo "======================================"
          java -version

          echo ""
          echo "======================================"
          echo "JAVAC"
          echo "======================================"
          javac -version

          echo ""
          echo "======================================"
          echo "GRADLE"
          echo "======================================"
          gradle --version

      # 6. Extract FilmFilter v7
      - name: Extract FilmFilter v7
        shell: bash
        run: |
          set -e

          ZIP="FilmFilter_Pro_v7.zip"

          echo "======================================"
          echo "FilmFilter v7"
          echo "ZIP: $ZIP"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          rm -rf /tmp/filmfilter-v7
          mkdir -p /tmp/filmfilter-v7

          echo ""
          echo "Extracting ZIP..."

          unzip -q "$ZIP" -d /tmp/filmfilter-v7

          echo ""
          echo "======================================"
          echo "ZIP CONTENTS"
          echo "======================================"

          find /tmp/filmfilter-v7 -maxdepth 7 -type f | sort

          # Find Android project
          ROOT=$(find /tmp/filmfilter-v7 \
            -name settings.gradle -o -name settings.gradle.kts \
            -print -quit)

          if [ -z "$ROOT" ]; then
            echo ""
            echo "ERROR: Android project not found inside ZIP."
            echo ""
            echo "settings.gradle or settings.gradle.kts is missing."
            echo ""
            echo "ZIP structure:"
            find /tmp/filmfilter-v7 -maxdepth 8 -print | sort
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT FOUND"
          echo "======================================"
          echo "$ROOT"

          # Remove old project files
          rm -rf app
          rm -rf gradle

          rm -f settings.gradle
          rm -f settings.gradle.kts
          rm -f build.gradle
          rm -f build.gradle.kts
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          # Copy Android project from ZIP
          cp -a "$ROOT"/. .

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT COPIED"
          echo "======================================"

          find . -maxdepth 6 -type f | sort

      # 7. Verify Android project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFY ANDROID PROJECT"
          echo "======================================"

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo ""
          echo "Android
