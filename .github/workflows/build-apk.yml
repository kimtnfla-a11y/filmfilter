name: FilmFilter v6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FilmFilter v6
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # 2. Java 17
      # ─────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ─────────────────────────────────────
      # 3. Android SDK
      # ─────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ─────────────────────────────────────
      # 4. Gradle 8.11.1
      # ─────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # ─────────────────────────────────────
      # 5. Verify Java / Gradle
      # ─────────────────────────────────────
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== JAVAC ====="
          javac -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version

      # ─────────────────────────────────────
      # 6. Extract FilmFilter v6
      # ─────────────────────────────────────
      - name: Extract FilmFilter v6
        shell: bash
        run: |
          set -e

          ZIP="FilmFilter_Pro_v6.zip"

          echo "======================================"
          echo "FilmFilter v6"
          echo "ZIP: $ZIP"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          rm -rf /tmp/filmfilter-v6
          mkdir -p /tmp/filmfilter-v6

          echo "Extracting $ZIP..."

          unzip -q "$ZIP" -d /tmp/filmfilter-v6

          echo ""
          echo "ZIP contents:"
          find /tmp/filmfilter-v6 -maxdepth 6 -type f | sort

          # Android 프로젝트의 settings.gradle 탐색
          ROOT=$(find /tmp/filmfilter-v6 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$ROOT" ]; then
            echo ""
            echo "ERROR: Android project not found inside ZIP."
            echo "settings.gradle or settings.gradle.kts is missing."
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo ""
          echo "======================================"
          echo "Android project found:"
          echo "$ROOT"
          echo "======================================"

          # 기존 작업 디렉터리 정리
          rm -rf app
          rm -rf gradle
          rm -f settings.gradle
          rm -f settings.gradle.kts
          rm -f build.gradle
          rm -f build.gradle.kts
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          # Android 프로젝트 복사
          cp -a "$ROOT"/. .

          echo ""
          echo "Android project copied."

          echo ""
          echo "Project structure:"
          find . -maxdepth 5 -type f | sort

      # ─────────────────────────────────────
      # 7. Verify Android project
      # ─────────────────────────────────────
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo ""
          echo "Android project structure OK."

      # ─────────────────────────────────────
      # 8. Make Gradle wrapper executable
      # ─────────────────────────────────────
      - name: Prepare Gradle
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using Gradle 8.11.1 installed by setup-gradle."
          fi

      # ─────────────────────────────────────
      # 9. Build Debug APK
      # ─────────────────────────────────────
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building FilmFilter v6 Debug APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew \
              clean \
              assembleDebug \
              --stacktrace \
              --no-daemon
          else
            gradle \
              clean \
              assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      # ─────────────────────────────────────
      # 10. Verify APK
      # ─────────────────────────────────────
      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK was not created."
            echo ""
            echo "Build output:"
            find app/build -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "APK:"
          ls -lh "$APK"

      # ─────────────────────────────────────
      # 11. Upload APK
      # ─────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmFilter-v6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
