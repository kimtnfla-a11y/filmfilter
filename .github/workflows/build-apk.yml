name: Build FilmFilter v8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Android SDK 36 설치
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # 5. Gradle 8.11.1 설치
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 6. ZIP 존재 확인
      - name: Check FilmFilter v8 ZIP
        shell: bash
        run: |
          set -e

          ZIP="FilmFilter_Pro_v8.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP"

      # 7. ZIP 무결성 확인
      - name: Test ZIP
        shell: bash
        run: |
          set -e

          unzip -t FilmFilter_Pro_v8.zip

          echo "ZIP integrity check passed."

      # 8. ZIP 압축 해제
      - name: Extract FilmFilter v8
        shell: bash
        run: |
          set -e

          ZIP="FilmFilter_Pro_v8.zip"
          EXTRACT_DIR="/tmp/filmfilter-v8"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          echo "Extracted structure:"
          find "$EXTRACT_DIR" -maxdepth 4 -type f | sort

      # 9. Android 프로젝트 자동 검색
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          ROOT="/tmp/filmfilter-v8"

          PROJECT_DIR=""

          # settings.gradle 우선 검색
          SETTINGS=$(find "$ROOT" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be located."
            echo ""
            echo "Extracted files:"
            find "$ROOT" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      # 10. 프로젝트 구조 확인
      - name: Verify project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo ""

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found"
            exit 1
          fi

      # 11. Java 확인
      - name: Verify Java 17
        shell: bash
        run: |
          set -e

          java -version

          JAVA_VERSION=$(java -version 2>&1 | grep -o '"17[^"]*"' | head -n 1 || true)

          if [ -z "$JAVA_VERSION" ]; then
            echo "ERROR: Java 17 is not active."
            exit 1
          fi

          echo "Java 17 verified."

      # 12. Gradle 버전 확인
      - name: Verify Gradle 8.11.1
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle --version

      # 13. 프로젝트 설정 검사
      - name: Check Android build configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking build configuration..."

          echo ""
          echo "Root build.gradle:"
          if [ -f "build.gradle" ]; then
            cat build.gradle
          elif [ -f "build.gradle.kts" ]; then
            cat build.gradle.kts
          fi

          echo ""
          echo "App build.gradle:"
          if [ -f "app/build.gradle" ]; then
            cat app/build.gradle
          elif [ -f "app/build.gradle.kts" ]; then
            cat app/build.gradle.kts
          fi

      # 14. Clean build
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean

      # 15. Debug APK 빌드
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # 16. APK 확인
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build directory:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 6 \
              -type f \
              | sort || true
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESS"
          echo "======================================"
          echo "APK:"
          echo "$APK"
          echo ""
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 17. APK 업로드
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmFilter-v8-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
