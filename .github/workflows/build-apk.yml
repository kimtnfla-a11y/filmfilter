name: FilmFilter v7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FilmFilter v7
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Gradle 8.11.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 5. Verify build environment
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "JAVA"
          echo "======================================"
          java -version

          echo ""
          echo "======================================"
          echo "JAVAC"
          echo "======================================"
          javac -version

          echo ""
          echo "======================================"
          echo "GRADLE"
          echo "======================================"
          gradle --version

      # 6. Extract FilmFilter v7
      - name: Extract FilmFilter v7
        shell: bash
        run: |
          set -e

          ZIP="FilmFilter_Pro_v7.zip"
          EXTRACT_DIR="/tmp/filmfilter-v7"

          echo "======================================"
          echo "FilmFilter v7"
          echo "ZIP: $ZIP"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo ""
          echo "Extracting ZIP..."

          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          echo ""
          echo "======================================"
          echo "ZIP CONTENTS"
          echo "======================================"

          find "$EXTRACT_DIR" -maxdepth 8 -type f | sort

          # 현재 ZIP 구조:
          # /tmp/filmfilter-v7/FilmFilter_v7/
          # ├── app/
          # ├── build.gradle
          # ├── settings.gradle
          # └── gradle.properties

          PROJECT_DIR="$EXTRACT_DIR/FilmFilter_v7"

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: FilmFilter_v7 directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          # 기존 프로젝트 파일 제거
          rm -rf app
          rm -rf gradle

          rm -f settings.gradle
          rm -f settings.gradle.kts
          rm -f build.gradle
          rm -f build.gradle.kts
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          # Android 프로젝트 복사
          cp -a "$PROJECT_DIR"/. .

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT COPIED"
          echo "======================================"

          find . -maxdepth 6 -type f | sort

      # 7. Verify Android project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFY ANDROID PROJECT"
          echo "======================================"

          if [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo ""
          echo "Android project structure OK."

      # 8. Prepare Gradle
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using Gradle 8.11.1."
          fi

      # 9. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING FILMFILTER V7"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            ./gradlew \
              clean \
              assembleDebug \
              --stacktrace \
              --no-daemon \
              --console=plain

          else

            gradle \
              clean \
              assembleDebug \
              --stacktrace \
              --no-daemon \
              --console=plain

          fi

      # 10. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.gradle/*" \
            -print

      # 11. Check APK
      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo ""
          echo "======================================"
          echo "CHECK APK"
          echo "======================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            echo ""
            echo "Build output:"
            find app/build -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FILMFILTER V7 BUILD SUCCESS"
          echo "======================================"

          echo ""
          echo "APK:"
          ls -lh "$APK"

      # 12. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmFilter-v7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
