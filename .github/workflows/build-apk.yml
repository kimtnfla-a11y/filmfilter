name: FilmFilter v6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract FilmFilter v6
        shell: bash
        run: |
          set -e

          ZIP="FilmFilter_Pro_v6.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf /tmp/filmfilter-v6
          mkdir -p /tmp/filmfilter-v6

          unzip -q "$ZIP" -d /tmp/filmfilter-v6

          ROOT=$(find /tmp/filmfilter-v6 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project not found inside $ZIP"
            find /tmp/filmfilter-v6 -maxdepth 5 -type f | sort
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "Using Android project:"
          echo "$ROOT"

          cp -a "$ROOT"/. .

          echo "Project files:"
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "App files:"
          find app -maxdepth 6 -type f | sort

      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 8.11.1."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            echo "Build output:"
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmFilter-v6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
