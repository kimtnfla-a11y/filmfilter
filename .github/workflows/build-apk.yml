name: Build FilmFilter v8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK environment
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 4. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          echo "Android SDK licenses processed."

      # 5. Install only required Android SDK packages
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # 6. Verify Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed | grep -E \
            "platforms;android-36|build-tools;35.0.0|platform-tools" \
            || true

      # 7. Install Gradle 8.11.1
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 8. Check ZIP
      - name: Check FilmFilter v8 ZIP
        shell: bash
        run: |
          set -e

          ZIP="FilmFilter_Pro_v8.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP:"
          ls -lh "$ZIP"

      # 9. Test ZIP integrity
      - name: Test ZIP
        shell: bash
        run: |
          set -e

          unzip -t "FilmFilter_Pro_v8.zip"

          echo "ZIP integrity check passed."

      # 10. Extract ZIP
      - name: Extract FilmFilter v8
        shell: bash
        run: |
          set -e

          ZIP="FilmFilter_Pro_v8.zip"
          EXTRACT_DIR="/tmp/filmfilter-v8"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          echo "Extracted structure:"
          find "$EXTRACT_DIR" -maxdepth 5 -type f | sort

      # 11. Locate Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          ROOT="/tmp/filmfilter-v8"

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."

            echo ""
            echo "Extracted files:"
            find "$ROOT" -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # 12. Verify project structure
      - name: Verify project structure
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""
          echo "Project contents:"
          find . -maxdepth 3 -type f | sort

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

      # 13. Verify Java
      - name: Verify Java 17
        shell: bash
        run: |
          set -e

          java -version

          JAVA_MAJOR=$(
            java -version 2>&1 \
            | sed -n 's/.*version "\([0-9]*\).*/\1/p' \
            | head -n 1
          )

          if [ "$JAVA_MAJOR" != "17" ]; then
            echo "ERROR: Java 17 required."
            echo "Detected Java major version: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java 17 verified."

      # 14. Verify Gradle
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

      # 15. Display build configuration
      - name: Display build configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ROOT BUILD FILE"
          echo "======================================"

          if [ -f "build.gradle" ]; then
            cat build.gradle
          elif [ -f "build.gradle.kts" ]; then
            cat build.gradle.kts
          fi

          echo ""
          echo "======================================"
          echo "APP BUILD FILE"
          echo "======================================"

          if [ -f "app/build.gradle" ]; then
            cat app/build.gradle
          elif [ -f "app/build.gradle.kts" ]; then
            cat app/build.gradle.kts
          fi

      # 16. Clean
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean

      # 17. Build
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # 18. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 7 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESS"
          echo "======================================"
          echo "$APK"
          echo ""

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 19. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmFilter-v8-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
