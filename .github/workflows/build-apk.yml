name: FilmFilter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract FilmFilter v4
        shell: bash
        run: |
          set -e

          rm -rf /tmp/filmfilter-v4
          mkdir -p /tmp/filmfilter-v4

          unzip -q FilmFilter_Pro_v4.zip -d /tmp/filmfilter-v4

          ROOT=$(find /tmp/filmfilter-v4 -name settings.gradle -type f | head -n 1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle not found in ZIP"
            exit 1
          fi

          echo "Using project: $ROOT"

          cp -a "$ROOT"/. .

          echo "Project files:"
          ls -la

          echo "App files:"
          find app -maxdepth 4 -type f | sort

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmFilter-Pro-v4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
