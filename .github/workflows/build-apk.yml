name: FilmFilter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/filmfilter
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FilmFilter"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.filmfilter'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.filmfilter'
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FilmFilter"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:colorAccent">#333333</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/example/filmfilter/MainActivity.java <<'EOF'
          package com.example.filmfilter;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageButton;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final int PICK_IMAGE = 100;
              private static final int TAKE_PHOTO = 101;

              private ImageView imageView;
              private TextView filterName;
              private TextView statusText;
              private SeekBar intensityBar;

              private Bitmap originalBitmap;
              private Bitmap currentBitmap;

              private int selectedFilter = 0;
              private float intensity = 0.70f;

              private final String[] FILTER_NAMES = {
                  "Original",
                  "Warm",
                  "Gold",
                  "Soft",
                  "Classic",
                  "Faded",
                  "Cool",
                  "Green",
                  "Retro",
                  "Dream",
                  "B&W",
                  "Mono Fade"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUI();
              }

              private int dp(float value) {
                  return (int)(value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(
                  String value,
                  float size
              ) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.rgb(30, 30, 30));
                  return t;
              }

              private void buildUI() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(dp(18), dp(10), dp(18), dp(6));

                  TextView title = text("FilmFilter", 22);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);

                  top.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(55),
                          1
                      )
                  );

                  Button save = new Button(this);
                  save.setText("저장");
                  save.setOnClickListener(v -> savePhoto());

                  top.addView(
                      save,
                      new LinearLayout.LayoutParams(
                          dp(75),
                          dp(50)
                      )
                  );

                  root.addView(top);

                  imageView = new ImageView(this);
                  imageView.setBackgroundColor(
                      Color.rgb(235, 235, 235)
                  );
                  imageView.setScaleType(
                      ImageView.ScaleType.FIT_CENTER
                  );

                  LinearLayout.LayoutParams imageParams =
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      );

                  imageParams.setMargins(
                      dp(12),
                      dp(4),
                      dp(12),
                      dp(4)
                  );

                  root.addView(imageView, imageParams);

                  filterName = text(
                      "Original",
                      18
                  );
                  filterName.setGravity(Gravity.CENTER);

                  root.addView(
                      filterName,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(42)
                      )
                  );

                  intensityBar = new SeekBar(this);
                  intensityBar.setMax(100);
                  intensityBar.setProgress(70);

                  intensityBar.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {

                          @Override
                          public void onProgressChanged(
                              SeekBar seekBar,
                              int progress,
                              boolean fromUser
                          ) {

                              intensity =
                                  progress / 100f;

                              if (
                                  fromUser &&
                                  originalBitmap != null
                              ) {
                                  applySelectedFilter();
                              }
                          }

                          @Override
                          public void onStartTrackingTouch(
                              SeekBar seekBar
                          ) {}

                          @Override
                          public void onStopTrackingTouch(
                              SeekBar seekBar
                          ) {}
                      }
                  );

                  LinearLayout intensityRow =
                      new LinearLayout(this);

                  intensityRow.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  TextView intensityLabel =
                      text("강도", 14);

                  intensityRow.addView(
                      intensityLabel,
                      new LinearLayout.LayoutParams(
                          dp(45),
                          -2
                      )
                  );

                  intensityRow.addView(
                      intensityBar,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(45),
                          1
                      )
                  );

                  root.addView(
                      intensityRow,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(50)
                      )
                  );

                  HorizontalScrollView scroll =
                      new HorizontalScrollView(this);

                  LinearLayout filters =
                      new LinearLayout(this);

                  filters.setOrientation(
                      LinearLayout.HORIZONTAL
                  );

                  filters.setPadding(
                      dp(10),
                      dp(5),
                      dp(10),
                      dp(5)
                  );

                  for (
                      int i = 0;
                      i < FILTER_NAMES.length;
                      i++
                  ) {

                      final int index = i;

                      Button b = new Button(this);
                      b.setText(FILTER_NAMES[i]);
                      b.setTextSize(12);

                      b.setOnClickListener(
                          v -> {

                              selectedFilter = index;

                              filterName.setText(
                                  FILTER_NAMES[index]
                              );

                              applySelectedFilter();
                          }
                      );

                      filters.addView(
                          b,
                          new LinearLayout.LayoutParams(
                              dp(95),
                              dp(50)
                          )
                      );
                  }

                  scroll.addView(filters);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(62)
                      )
                  );

                  LinearLayout bottom =
                      new LinearLayout(this);

                  bottom.setPadding(
                      dp(10),
                      dp(4),
                      dp(10),
                      dp(10)
                  );

                  Button camera =
                      new Button(this);

                  camera.setText("📷 카메라");

                  camera.setOnClickListener(
                      v -> takePhoto()
                  );

                  bottom.addView(
                      camera,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(55),
                          1
                      )
                  );

                  Button gallery =
                      new Button(this);

                  gallery.setText("🖼 갤러리");

                  gallery.setOnClickListener(
                      v -> selectPhoto()
                  );

                  bottom.addView(
                      gallery,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(55),
                          1
                      )
                  );

                  Button original =
                      new Button(this);

                  original.setText("↩ 원본");

                  original.setOnClickListener(
                      v -> restoreOriginal()
                  );

                  bottom.addView(
                      original,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(55),
                          1
                      )
                  );

                  root.addView(bottom);

                  statusText = text(
                      "사진을 선택하거나 카메라로 촬영하세요",
                      12
                  );

                  statusText.setGravity(
                      Gravity.CENTER
                  );

                  root.addView(
                      statusText,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(28)
                      )
                  );

                  setContentView(root);
              }

              private void selectPhoto() {

                  Intent intent =
                      new Intent(
                          Intent.ACTION_OPEN_DOCUMENT
                      );

                  intent.setType("image/*");

                  intent.addCategory(
                      Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                      intent,
                      PICK_IMAGE
                  );
              }

              private void takePhoto() {

                  Intent intent =
                      new Intent(
                          MediaStore.ACTION_IMAGE_CAPTURE
                      );

                  if (
                      intent.resolveActivity(
                          getPackageManager()
                      ) != null
                  ) {

                      startActivityForResult(
                          intent,
                          TAKE_PHOTO
                      );

                  } else {

                      Toast.makeText(
                          this,
                          "카메라를 사용할 수 없습니다.",
                          Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (
                      resultCode != RESULT_OK ||
                      data == null
                  ) {
                      return;
                  }

                  try {

                      Bitmap bitmap = null;

                      if (
                          requestCode == PICK_IMAGE &&
                          data.getData() != null
                      ) {

                          Uri uri =
                              data.getData();

                          InputStream input =
                              getContentResolver()
                                  .openInputStream(uri);

                          bitmap =
                              BitmapFactory.decodeStream(
                                  input
                              );

                          input.close();

                      } else if (
                          requestCode == TAKE_PHOTO
                      ) {

                          Bundle extras =
                              data.getExtras();

                          if (extras != null) {
                              bitmap =
                                  (Bitmap)
                                  extras.get(
                                      "data"
                                  );
                          }
                      }

                      if (bitmap != null) {

                          originalBitmap =
                              resize(
                                  bitmap,
                                  1600
                              );

                          currentBitmap =
                              originalBitmap;

                          selectedFilter = 0;
                          intensity = 0.70f;

                          intensityBar.setProgress(70);

                          filterName.setText(
                              "Original"
                          );

                          imageView.setImageBitmap(
                              originalBitmap
                          );

                          statusText.setText(
                              "사진 준비 완료"
                          );
                      }

                  } catch (Exception e) {

                      e.printStackTrace();

                      Toast.makeText(
                          this,
                          "사진을 불러오지 못했습니다.",
                          Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private Bitmap resize(
                  Bitmap bitmap,
                  int max
              ) {

                  if (bitmap == null) {
                      return null;
                  }

                  int w = bitmap.getWidth();
                  int h = bitmap.getHeight();

                  int longest =
                      Math.max(w, h);

                  if (longest <= max) {
                      return bitmap;
                  }

                  float scale =
                      max / (float) longest;

                  return Bitmap.createScaledBitmap(
                      bitmap,
                      Math.round(w * scale),
                      Math.round(h * scale),
                      true
                  );
              }

              private void restoreOriginal() {

                  if (originalBitmap == null) {
                      return;
                  }

                  selectedFilter = 0;

                  filterName.setText(
                      "Original"
                  );

                  intensityBar.setProgress(70);

                  currentBitmap =
                      originalBitmap;

                  imageView.setImageBitmap(
                      originalBitmap
                  );

                  statusText.setText(
                      "원본으로 되돌렸습니다"
                  );
              }

              private void applySelectedFilter() {

                  if (originalBitmap == null) {
                      Toast.makeText(
                          this,
                          "먼저 사진을 선택하세요.",
                          Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  if (selectedFilter == 0) {

                      currentBitmap =
                          originalBitmap;

                      imageView.setImageBitmap(
                          originalBitmap
                      );

                      return;
                  }

                  Bitmap result =
                      originalBitmap.copy(
                          Bitmap.Config.ARGB_8888,
                          true
                      );

                  int width =
                      result.getWidth();

                  int height =
                      result.getHeight();

                  int[] pixels =
                      new int[
                          width * height
                      ];

                  result.getPixels(
                      pixels,
                      0,
                      width,
                      0,
                      0,
                      width,
                      height
                  );

                  for (int i = 0;
                       i < pixels.length;
                       i++) {

                      int pixel =
                          pixels[i];

                      float r =
                          Color.red(pixel)
                          / 255f;

                      float g =
                          Color.green(pixel)
                          / 255f;

                      float b =
                          Color.blue(pixel)
                          / 255f;

                      float[] filtered =
                          filter(
                              r,
                              g,
                              b,
                              selectedFilter
                          );

                      float amount =
                          intensity;

                      r = r +
                          (filtered[0] - r)
                          * amount;

                      g = g +
                          (filtered[1] - g)
                          * amount;

                      b = b +
                          (filtered[2] - b)
                          * amount;

                      pixels[i] =
                          Color.argb(
                              Color.alpha(pixel),
                              Math.round(
                                  clamp(r) * 255
                              ),
                              Math.round(
                                  clamp(g) * 255
                              ),
                              Math.round(
                                  clamp(b) * 255
                              )
                          );
                  }

                  result.setPixels(
                      pixels,
                      0,
                      width,
                      0,
                      0,
                      width,
                      height
                  );

                  currentBitmap =
                      result;

                  imageView.setImageBitmap(
                      result
                  );
              }

              private float[] filter(
                  float r,
                  float g,
                  float b,
                  int type
              ) {

                  float lum =
                      0.2126f * r +
                      0.7152f * g +
                      0.0722f * b;

                  float nr = r;
                  float ng = g;
                  float nb = b;

                  switch (type) {

                      case 1:
                          // Warm
                          nr = r * 1.04f + 0.025f;
                          ng = g * 1.01f + 0.005f;
                          nb = b * 0.94f;
                          break;

                      case 2:
                          // Gold
                          nr = r * 1.07f + 0.025f;
                          ng = g * 1.02f;
                          nb = b * 0.87f;
                          break;

                      case 3:
                          // Soft
                          nr = lum +
                              (r - lum) * 0.82f;
                          ng = lum +
                              (g - lum) * 0.82f;
                          nb = lum +
                              (b - lum) * 0.82f;

                          nr = 0.035f +
                              nr * 0.93f;

                          ng = 0.035f +
                             
